<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Lato:wght@400&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1128px;height:191px;overflow:hidden;background:#2B2C21;font-family:Lato,sans-serif;position:relative}
.copy{position:absolute;left:236px;top:0;bottom:0;width:360px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:8.5px;letter-spacing:.32em;text-transform:uppercase;color:#B6AE93}
h1{margin-top:10px;font-family:'Playfair Display',serif;font-weight:400;font-size:25px;line-height:1.14;text-transform:uppercase;color:#F3EEE2;letter-spacing:.01em}
.rule{margin-top:12px;height:1px;width:34px;background:#B6AE93;opacity:.6}
.disc{margin-top:10px;font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:#DCD6C6}
.disc span{color:#B6AE93;margin:0 6px}
.strip{position:absolute;right:0;top:0;bottom:0;left:612px;display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:3px}
.strip div{background-size:cover;background-position:center;position:relative}
.strip div::after{content:"";position:absolute;inset:0;background:#2B2C21;opacity:.08}
.url{position:absolute;right:14px;bottom:10px;font-size:7.5px;letter-spacing:.28em;text-transform:uppercase;color:#F3EEE2;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.fade{position:absolute;top:0;bottom:0;left:612px;width:40px;background:linear-gradient(90deg,#2B2C21,transparent);z-index:1}
</style></head><body>
<div class="copy">
  <p class="eyebrow">A creative house &nbsp;·&nbsp; Lagos</p>
  <h1>Spaces, stories &amp; experiences<br>without borders.</h1>
  <div class="rule"></div>
  <p class="disc">Events<span>/</span>Styling<span>/</span>Interiors<span>/</span>Gifting</p>
</div>

<div class="strip">
  <div style="background-image:url(../../public/assets/images/portfolio/middle-east/sunset-violinists.jpeg);background-position:58% 60%"></div>
  <div style="background-image:url(../../public/assets/images/portfolio/europe/palace-dining-room.webp);background-position:50% 55%"></div>
  <div style="background-image:url(../../public/assets/images/home/Interior-design.jpeg);background-position:40% 60%"></div>
  <div style="background-image:url(../../public/assets/images/home/gifts.jpeg);background-position:50% 45%"></div>
</div>
<p class="url">maisonfave.com</p>
</body></html>
